# Render 배포 설정 — 무료 plan
services:
  - type: web
    name: nextport-workspace
    runtime: docker
    region: singapore  # 한국에서 가장 가까운 무료 리전
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENV_MODE
        value: cloud
      - key: PORT
        value: "8080"
      - key: GEMINI_API_KEY
        sync: false  # Render Dashboard 에서 직접 박기 (보안)
    disk:
      name: nextport-data
      mountPath: /app/data
      sizeGB: 1
